name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io

jobs:
  build_push_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx (for caching)
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image with Caching
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from=type=registry,ref=$REGISTRY/${{ secrets.DOCKER_IMAGE }}:cache \
            --cache-to=type=registry,ref=$REGISTRY/${{ secrets.DOCKER_IMAGE }}:cache,mode=max \
            --push -t $REGISTRY/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }} .

  deploy_app:
    runs-on: ubuntu-latest
    needs: build_push_image
    steps:
      - name: Set up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Docker Compose on Remote Server
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
          cd ~/telegram-clone
          git pull
          docker-compose down --remove-orphans
          docker-compose pull
          docker-compose up -d --build --remove-orphans
          EOF
