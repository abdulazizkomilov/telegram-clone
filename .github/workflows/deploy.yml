name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io

jobs:
  build_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set Image Tag
        id: image_tag
        run: |
          IMAGE_TAG="${{ github.run_id }}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        run: |
          docker build -t $REGISTRY/${{ secrets.DOCKER_IMAGE }}:$IMAGE_TAG .
          docker tag $REGISTRY/${{ secrets.DOCKER_IMAGE }}:$IMAGE_TAG $REGISTRY/${{ secrets.DOCKER_IMAGE }}:latest
          docker push $REGISTRY/${{ secrets.DOCKER_IMAGE }}:$IMAGE_TAG
          docker push $REGISTRY/${{ secrets.DOCKER_IMAGE }}:latest

  deploy_image:
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Image on Server
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
          cd ~/telegram-clone
          git pull
          docker-compose down --remove-orphans
          docker-compose pull $REGISTRY/${{ secrets.DOCKER_IMAGE }}:latest
          docker-compose up -d --force-recreate --remove-orphans
          EOF
